name: Actualizar biblioteca

on:
  # A mano: pestaña Actions > Actualizar biblioteca > Run workflow
  workflow_dispatch:
    inputs:
      reintentar_portadas:
        description: "Reintentar las portadas que fallaron"
        type: boolean
        default: false
      forzar:
        description: "Publicar aunque falten muchos libros respecto a la vez anterior"
        type: boolean
        default: false
  # Automático: cada día
  schedule:
    - cron: "17 3 * * *"
  # Cada vez que cambias algo en la web o en la configuración
  push:
    branches: [main]
    paths:
      - "web/**"
      - "config.json"
      - "overrides.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: biblioteca
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Leer Drive y generar el catálogo
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: python scripts/build_catalog.py ${{ inputs.reintentar_portadas && '--retry-covers' || '' }} ${{ inputs.forzar && '--force' || '' }}

      - name: Guardar el catálogo en el repositorio
        run: |
          git config user.name "biblioteca-bot"
          git config user.email "biblioteca-bot@users.noreply.github.com"
          git add web/data web/covers
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "Actualizar catálogo"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
